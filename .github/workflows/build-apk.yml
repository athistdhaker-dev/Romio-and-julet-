# Romeo and Juliet (J2ME) -> native-style Android APKs (mobile only, every CPU architecture), signed with one fixed key.
# Put this file at:  .github/workflows/build-apk.yml
# Then upload romeo_juliet_port.zip to the repo root (use a NEW, separate GitHub repo). Everything else is automatic.
#
# How it works: the open-source J2ME Loader engine (Apache-2.0) is built in its "midlet" mode, which makes a
# standalone app. The game's own classes + resources from game/game.jar are bundled inside, so the APK opens
# straight into the game (no emulator menu, no file picker), exactly like a normal Android game.

name: Build Romeo and Juliet APKs (Mobile, all architectures)

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned J2ME Loader commit (the structure this workflow was written against).
  LOADER_COMMIT: 9b0fa48a0a0d1e61376c0b9af28b3d2caec0a4cc
  NDK_VERSION: 22.1.7171670

jobs:
  build:
    name: Unzip and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Unzip project
        run: |
          set -euo pipefail
          ZIP="$(ls -1t ./*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error::Repo root me koi .zip file nahi mili."
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SCRIPT="$(find _src -maxdepth 3 -name prepare_port.py | head -n 1)"
          if [ -z "$SCRIPT" ]; then
            echo "::error::Zip ke andar tools/prepare_port.py nahi mili."
            exit 1
          fi
          APP_DIR="$(dirname "$(dirname "$SCRIPT")")"
          if [ ! -f "$APP_DIR/game/game.jar" ] || [ ! -f "$APP_DIR/game/MANIFEST.MF" ]; then
            echo "::error::Zip me game/game.jar ya game/MANIFEST.MF nahi mili."
            exit 1
          fi
          echo "APP_DIR=$GITHUB_WORKSPACE/$APP_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $APP_DIR"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK pieces
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      # One fixed signing key for every build, so new APKs install OVER old ones
      # (a different key per build is what causes "App not installed").
      # Add your own key with repo secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KS_ALIAS_NAME=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "Using the keystore from repo secrets"
          else
            echo "KS_FILE=$APP_DIR/tools/rj-sideload.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=rj-port@2026" >> "$GITHUB_ENV"
            echo "KS_ALIAS_NAME=rj-port" >> "$GITHUB_ENV"
            echo "Using the bundled sideload key (same on every build)"
          fi
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Fetch J2ME Loader (pinned commit)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loader"
          cd "$RUNNER_TEMP/loader"
          git init -q
          git remote add origin https://github.com/nikita36078/J2ME-Loader.git
          git fetch -q --depth 1 origin "$LOADER_COMMIT"
          git checkout -q FETCH_HEAD
          echo "LOADER_DIR=$RUNNER_TEMP/loader" >> "$GITHUB_ENV"

      - name: Bundle the game into the app
        run: |
          set -euo pipefail
          python3 "$APP_DIR/tools/prepare_port.py" "$LOADER_DIR" "$APP_DIR/game" "$KS_FILE" "$KS_PASS" "$KS_ALIAS_NAME"

      # One APK per CPU architecture (smaller downloads) + one universal APK with all of them.
      - name: Build APKs
        working-directory: ${{ env.LOADER_DIR }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            rm -rf app/build/outputs/apk
            ./gradlew assembleMidletRelease -Pabis="$abi" --stacktrace
            APK="$(find app/build/outputs/apk/midlet/release -name '*.apk' | head -n 1)"
            test -n "$APK"
            cp "$APK" "$GITHUB_WORKSPACE/dist/RomeoAndJuliet-Mobile-$abi-build${{ github.run_number }}.apk"
          done
          rm -rf app/build/outputs/apk
          ./gradlew assembleMidletRelease --stacktrace
          APK="$(find app/build/outputs/apk/midlet/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/RomeoAndJuliet-Mobile-universal-build${{ github.run_number }}.apk"

      - name: Verify signatures
        run: |
          set -euo pipefail
          ls -lh dist
          for f in dist/*.apk; do "$APKSIGNER" verify --print-certs "$f" | head -n 3; done
          test "$(ls dist/*.apk | wc -l)" -eq 4

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: romeo-juliet-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_number }}
          name: Romeo and Juliet build ${{ github.run_number }}
          commit: ${{ github.sha }}
          artifacts: dist/*.apk
          prerelease: true
          allowUpdates: true
          body: |
            Romeo and Juliet - J2ME game packaged as a standalone Android app, built automatically from the uploaded zip.
            - RomeoAndJuliet-Mobile-arm64-v8a-*.apk : most phones
            - RomeoAndJuliet-Mobile-armeabi-v7a-*.apk : older 32-bit phones
            - RomeoAndJuliet-Mobile-x86_64-*.apk : emulators / x86 devices
            - RomeoAndJuliet-Mobile-universal-*.apk : all architectures (use if unsure)
            Commit: ${{ github.sha }}
