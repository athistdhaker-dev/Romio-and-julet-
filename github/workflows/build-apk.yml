name: Build APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: StarCrossed
      APP_SNAKE: star_crossed
      ORG: com.maraj

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Unpack newest source zip
        run: |
          set -euo pipefail
          ZIP="$(ls -t ./*.zip | head -n 1)"
          echo "Using $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src
          PUB="$(find _src -name pubspec.yaml -not -path '*/.*' | head -n 1)"
          test -n "$PUB"
          echo "APP_DIR=$(cd "$(dirname "$PUB")" && pwd)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            # keep our own sources safe from the project template
            rm -rf /tmp/keep && mkdir -p /tmp/keep
            cp -r lib test pubspec.yaml analysis_options.yaml /tmp/keep/
            flutter create --platforms=android --org "$ORG" --project-name "$APP_SNAKE" .
            rm -rf lib test
            cp -r /tmp/keep/lib /tmp/keep/test .
            cp /tmp/keep/pubspec.yaml /tmp/keep/analysis_options.yaml .
          fi
          rm -f test/widget_test.dart

      - name: Pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: flutter analyze

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: flutter test

      - name: Prepare signing key
        working-directory: ${{ env.APP_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "Signing with the private key from repository secrets"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; KPASS="$KEYSTORE_PASSWORD"; KALIAS="$KEY_ALIAS"
          else
            echo "Signing with the bundled PUBLIC sideload key (same key every build)"
            KS="$PWD/tools/${APP_SNAKE}-sideload.jks"; KPASS="sideload"; KALIAS="sideload"
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          {
            echo "KS=$KS"
            echo "KPASS=$KPASS"
            echo "KALIAS=$KALIAS"
            echo "APKSIGNER=$APKSIGNER"
          } >> "$GITHUB_ENV"

      - name: Build and sign APKs
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          python3 tools/patch_manifest.py mobile
          mkdir -p dist build/symbols
          N="${{ github.run_number }}"
          OUT=build/app/outputs/flutter-apk
          sign() {
            "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:$KPASS" \
              --ks-key-alias "$KALIAS" --v4-signing-enabled false \
              --out "$2" "$1"
          }

          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols/split
          sign "$OUT/app-arm64-v8a-release.apk"   "dist/${APP_NAME}-Mobile-arm64-v8a-build${N}.apk"
          sign "$OUT/app-armeabi-v7a-release.apk" "dist/${APP_NAME}-Mobile-armeabi-v7a-build${N}.apk"
          sign "$OUT/app-x86_64-release.apk"      "dist/${APP_NAME}-Mobile-x86_64-build${N}.apk"

          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols/universal
          sign "$OUT/app-release.apk" "dist/${APP_NAME}-Mobile-universal-build${N}.apk"

      - name: Verify APKs
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          for f in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | head -n 3
          done
          ls -l dist
          test "$(ls dist/*.apk | wc -l)" -eq 4

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apks-build${{ github.run_number }}
          path: ${{ env.APP_DIR }}/dist/*.apk

      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_number }}
          commit: ${{ github.sha }}
          name: Star Crossed build ${{ github.run_number }}
          prerelease: true
          allowUpdates: true
          artifacts: ${{ env.APP_DIR }}/dist/*.apk
          body: |
            Sideload builds (arm64-v8a, armeabi-v7a, x86_64, universal).
            Unsure which one? Install the universal APK.
